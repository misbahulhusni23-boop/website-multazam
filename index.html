button,label.b{background:#ffd23f;color:#222;border:0;border-radius:10px;padding:12px 20px;font-size:18px;font-weight:700;cursor:pointer}

document.getElementById('f').onchange=e=>{const r=new FileReader();r.onload=()=>{face=new Image();face.src=r.result};r.readAsDataURL(e.target.files[0])};
const ground=[[0,600],[700,500],[1300,400],[1800,600],[2500,800]];
const plats=[[300,250,96],[800,240,96],[1000,180,96],[1450,230,128],[1950,240,96],[2200,200,96],[2700,250,128]];
const solids=[...ground.map(g=>({x:g[0],y:GY,w:g[1],h:64})),...plats.map(p=>({x:p[0],y:p[1],w:p[2],h:20}))];
const mk=()=>({coins:[...plats.map(p=>[p[0]+p[2]/2,p[1]-24]),[200,300],[240,300],[1100,300],[1900,300],[2300,300],[2900,300]].map(a=>({x:a[0],y:a[1],on:1})),
en:[500,900,1400,2000,2600].map(a=>({x:a,y:GY-28,vx:-1,alive:1}))});
let W=mk(),p,keys={},score=0,lives=3,state='play',cam=0;
const reset=()=>p={x:60,y:200,vx:0,vy:0,w:28,h:44,g:0,dir:1};reset();
addEventListener('keydown',e=>{keys[e.code]=1;if(state!='play'&&e.code=='Space')restart()});addEventListener('keyup',e=>keys[e.code]=0);
[['L','ArrowLeft'],['R','ArrowRight'],['J','Space']].forEach(([id,k])=>{const b=document.getElementById(id);b.onpointerdown=e=>{keys[k]=1;if(state!='play')restart()};b.onpointerup=b.onpointerleave=()=>keys[k]=0});
function restart(){W=mk();score=0;lives=3;state='play';reset()}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function step(){
if(state!='play')return;
const l=keys.ArrowLeft||keys.KeyA,r=keys.ArrowRight||keys.KeyD,j=keys.Space||keys.ArrowUp||keys.KeyW;
p.vx=(r?4:0)-(l?4:0);if(p.vx)p.dir=p.vx>0?1:-1;
if(j&&p.g){p.vy=-13;p.g=0}
p.vy=Math.min(p.vy+0.6,14);
p.x=Math.max(0,p.x+p.vx);
for(const s of solids)if(hit(p,s)){p.x=p.vx>0?s.x-p.w:s.x+s.w}
p.y+=p.vy;p.g=0;
for(const s of solids)if(hit(p,s)){if(p.vy>0){p.y=s.y-p.h;p.g=1}else p.y=s.y+s.h;p.vy=0}
if(p.y>460)die();
for(const k of W.coins)if(k.on&&Math.hypot(k.x-p.x-14,k.y-p.y-20)<26){k.on=0;score+=10}
for(const e of W.en)if(e.alive){e.x+=e.vx;
const ahead={x:e.x+(e.vx>0?28:-4),y:e.y+28,w:4,h:6};
if(!solids.some(s=>hit(ahead,s)))e.vx*=-1;
const eb={x:e.x,y:e.y,w:28,h:28};
if(hit(p,eb)){if(p.vy>0&&p.y+p.h-p.vy<=e.y+8){e.alive=0;p.vy=-9;score+=50}else die()}}
if(p.x>3050){state='win'}
cam=Math.max(0,Math.min(p.x-300,3300-800));}
function die(){lives--;if(lives<=0)state='over';else reset()}
function draw(){
x.clearRect(0,0,800,400);x.save();x.translate(-cam,0);
x.fillStyle='#fff';for(let i=0;i<8;i++){const cx=i*450+100;x.beginPath();x.arc(cx,70+i%3*30,24,0,7);x.arc(cx+26,76+i%3*30,20,0,7);x.arc(cx-26,78+i%3*30,18,0,7);x.fill()}
for(const s of solids){x.fillStyle=s.h==64?'#a0522d':'#c97b3a';x.fillRect(s.x,s.y,s.w,s.h);if(s.h==64){x.fillStyle='#3cb043';x.fillRect(s.x,s.y,s.w,8)}else{x.strokeStyle='#7a4a1f';x.strokeRect(s.x,s.y,s.w,s.h)}}
x.fillStyle='#ffd700';for(const k of W.coins)if(k.on){x.beginPath();x.ellipse(k.x,k.y,7,10,0,0,7);x.fill()}
for(const e of W.en)if(e.alive){x.fillStyle='#8b4513';x.beginPath();x.arc(e.x+14,e.y+14,14,Math.PI,0);x.fill();x.fillRect(e.x,e.y+14,28,10);x.fillStyle='#fff';x.fillRect(e.x+6,e.y+10,6,6);x.fillRect(e.x+17,e.y+10,6,6);x.fillStyle='#000';x.fillRect(e.x+8,e.y+12,3,3);x.fillRect(e.x+19,e.y+12,3,3)}
x.fillStyle='#fff';x.fillRect(3100,GY-160,6,160);x.fillStyle='#e63946';x.fillRect(3106,GY-160,40,26);
// player
const px=p.x,py=p.y;x.fillStyle='#e63946';x.fillRect(px+4,py+26,20,10);x.fillStyle='#1d4ed8';x.fillRect(px+4,py+34,20,10);
x.fillStyle='#333';x.fillRect(px+(p.dir>0?14:2),py+42,12,4);
x.save();x.beginPath();x.arc(px+14,py+14,16,0,7);x.clip();
if(face.complete&&face.naturalWidth){if(p.dir<0){x.translate(px+14,0);x.scale(-1,1);x.drawImage(face,-16,py-2,32,32)}else x.drawImage(face,px-2,py-2,32,32)}else{x.fillStyle='#c68642';x.fill()}
x.restore();x.strokeStyle='#111';x.lineWidth=2;x.beginPath();x.arc(px+14,py+14,16,0,7);x.stroke();
x.restore();
x.fillStyle='#fff';x.font='bold 20px system-ui';x.fillText('Skor '+score+'   Nyawa '+'♥'.repeat(lives),12,28);
if(state!='play'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,800,400);x.fillStyle='#fff';x.font='bold 44px system-ui';x.textAlign='center';x.fillText(state=='win'?'MENANG! Skor '+score:'GAME OVER',400,190);x.font='20px system-ui';x.fillText('Tekan Spasi / LOMPAT untuk main lagi',400,230);x.textAlign='left'}}
(function loop(){step();draw();requestAnimationFrame(loop)})();
</script></body></html>
